name: Server app

# Proves a server application (Go and Node, with Postgres) and, for a tag, builds its release,
# for another repository. The repository provides:
#   ci/test-shards (optional) one machine per line, run side by side; each runs ci/test.sh NAME
#   ci/test.sh    the whole proof (gate, end-to-end, browser screenshots); it writes
#                 out/test-results.zip (logs and screenshots) and exits non-zero on a failure
#   ci/release.sh TAG   the release files, into out/
# A repository may keep its test data encrypted on its own release (ci/test.sh fetches it with
# the token and opens it with CI_DATA_KEY): the key is the secret CI_DATA_KEY_<NAME> (the
# repository's name upper-cased, other characters as _; each listed in the job), else CI_DATA_KEY. Results stay private: the zip goes onto a prerelease of that repository (ci-<commit>; the
# five newest are kept), and a tag's release files onto its own release. Nothing is kept here.
#
# Which repository: the `repo` input (owner/name) with RELEASE_TOKEN (one fine-grained token
# for all the owner's repositories, Contents read and write). Each job reads the name from the
# event file and masks it first, so the logs show *** for it.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository (owner/name)"
        required: true
        type: string
      ref:
        description: "Branch, commit or tag (a tag also builds its release)"
        required: true
        default: main
        type: string
      skip_tests:
        description: "Only build the release (the tag's commit was already proved)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  shards:
    name: Choose the machines
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Choose the repository
        shell: bash
        run: |
          r=$(jq -r '.inputs.repo // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$r"
          echo "::add-mask::${r#*/}"
          echo "REPO=$r" >> "$GITHUB_ENV"
      - name: "Read ci/test-shards (one machine per line; none: one machine for everything)"
        id: read
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          t=$(gh api "repos/$REPO/contents/ci/test-shards?ref=$REF" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          m=$(printf '%s\n' "$t" | sed 's/#.*//' | awk 'NF {print $1}' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          [ "$m" != "[]" ] || m='[""]'
          echo "machines: $m"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  test:
    name: Prove ${{ matrix.shard }}
    needs: shards
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Choose the repository
        shell: bash
        run: |
          r=$(jq -r '.inputs.repo // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$r"
          echo "::add-mask::${r#*/}"
          echo "REPO=$r" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Go linter (the repository's ci/golangci-lint-version, default 2.12.2)
        run: |
          v=$(cat ci/golangci-lint-version 2>/dev/null || echo 2.12.2)
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sudo sh -s -- -b /usr/local/bin "v$v"
      - name: Postgres 18 (local, as the postgres user)
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get purge -y -qq 'postgresql-1[0-7]*' >/dev/null || true
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-18 postgresql-client-18 >/dev/null
          sudo systemctl start postgresql
          sudo -u postgres psql -qAt -c 'select version()'
      - name: Web app dependencies
        run: npm ci --prefix frontend/next --no-audit --no-fund
      - name: Choose the data key (CI_DATA_KEY_<REPOSITORY NAME>, else CI_DATA_KEY)
        shell: bash
        # Each repository with a key is named here (a run that reads every secret at
        # once is held for approval): add a line for a new one.
        env:
          KEY_DEFAULT: ${{ secrets.CI_DATA_KEY }}
          KEY_CES_ERP: ${{ secrets.CI_DATA_KEY_CES_ERP }}
        run: |
          name="KEY_$(printf '%s' "${REPO#*/}" | tr 'a-z-' 'A-Z_' | tr -c 'A-Z0-9_' '_')"
          key="${!name:-$KEY_DEFAULT}"
          if [ -n "$key" ]; then echo "::add-mask::$key"; echo "CI_DATA_KEY=$key" >> "$GITHUB_ENV"; echo "data key: found"; else echo "data key: none (made-up data)"; fi
      - name: Prove (gate, end-to-end, screenshots)
        id: prove
        # The repository's data for the proof, if it keeps one encrypted on its
        # own release: CI_DATA_KEY (chosen above) opens it, the token fetches it.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: CI_REPO="$REPO" bash ci/test.sh "${{ matrix.shard }}"
      - name: Keep the results (private, on the repository)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SHARD: ${{ matrix.shard }}
        run: |
          [ -f out/test-results.zip ] || { echo "no results file"; exit 0; }
          sha=$(git rev-parse HEAD); tag="ci-${sha:0:7}"
          name="test-results-${sha:0:7}${SHARD:+-$SHARD}-${{ steps.prove.outcome }}.zip"
          mv out/test-results.zip "out/$name"
          # Machines finish at different times: the first creates the release.
          gh release view "$tag" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$REPO" --prerelease --target "$sha" --title "$tag" --notes "Proof of ${sha:0:7}" \
            || sleep 5
          gh release upload "$tag" -R "$REPO" "out/$name" --clobber
          gh release list -R "$REPO" --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName|startswith("ci-"))) | .tagName' \
            | tail -n +6 | while read -r old; do gh release delete "$old" -R "$REPO" --yes --cleanup-tag; done

  release:
    name: Release
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || inputs.skip_tests) && startsWith(github.event.inputs.ref, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Choose the repository
        shell: bash
        run: |
          r=$(jq -r '.inputs.repo // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$r"
          echo "::add-mask::${r#*/}"
          echo "REPO=$r" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: bash ci/release.sh "${{ inputs.ref }}"
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          gh release view "$REF" -R "$REPO" >/dev/null 2>&1 || gh release create "$REF" -R "$REPO" --verify-tag --generate-notes --title "$REF"
          gh release upload "$REF" -R "$REPO" out/* --clobber
