name: Build release

# Builds a tagged release of another repository and uploads the files to that repository's own
# release. The repository provides ci/release.sh (Linux) and ci/release.ps1 (Windows), which put
# the files in out/. Nothing is kept here (no artifacts).
#
# Which repository: the `repo` input (owner/name) with RELEASE_TOKEN (one fine-grained token for
# all the owner's repositories, Contents read and write). Without the input: the PRIVATE_REPO
# secret with PRIVATE_REPO_TOKEN. Each job reads the name from the event file and masks it first,
# so the logs show *** for it. With `android`, the repository's ci/android.sh builds a phone app
# (signed with ANDROID_KEYSTORE / ANDROID_KEYSTORE_PASSWORD) and ci/android-check.sh starts a test
# build on an emulator.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to build (owner/name); empty uses the PRIVATE_REPO secret"
        required: false
        default: ""
        type: string
      ref:
        description: "Tag to build (e.g. v1.2.3)"
        required: true
        type: string
      check_only:
        description: "Only check the token can read the repository"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build everything but upload nothing"
        required: false
        default: false
        type: boolean
      android:
        description: "Also build the Android app (the repository's ci/android.sh) and start it on an emulator"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REF: ${{ inputs.ref }}

jobs:
  release:
    name: Check and create the release
    runs-on: ubuntu-latest
    steps:
      - name: Choose the repository
        shell: bash
        env:
          SECRET_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          r=$(jq -r '.inputs.repo // ""' "$GITHUB_EVENT_PATH")
          [ -n "$r" ] || r="$SECRET_REPO"
          echo "::add-mask::$r"
          echo "::add-mask::${r#*/}"
          echo "REPO=$r" >> "$GITHUB_ENV"
      - name: Check the token
        env:
          GH_TOKEN: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$REPO" ]; then echo "no repository or token (repo input with RELEASE_TOKEN, or the PRIVATE_REPO pair)"; exit 1; fi
          gh api "repos/$REPO" --silent && echo "token can read the repository"
          gh api "repos/$REPO/git/ref/tags/$REF" --silent && echo "tag found" \
            || echo "tag not found (fine for a check)"
      - name: Create the release if it isn't there
        if: ${{ !inputs.check_only && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
        run: |
          gh release view "$REF" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$REF" -R "$REPO" --verify-tag --generate-notes --title "$REF"

  linux:
    name: Linux ${{ matrix.target }}
    needs: release
    if: ${{ !inputs.check_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Choose the repository
        shell: bash
        env:
          SECRET_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          r=$(jq -r '.inputs.repo // ""' "$GITHUB_EVENT_PATH")
          [ -n "$r" ] || r="$SECRET_REPO"
          echo "::add-mask::$r"
          echo "::add-mask::${r#*/}"
          echo "REPO=$r" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Downloaded and compiled dependencies (public crates), keyed by the repository's
      # Cargo.lock. rust-cache removes the repository's own crates from target/ before saving,
      # so no private code or embedded assets reach this public repository's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: bash ci/release.sh "${{ matrix.target }}" "$REF"
      - name: Upload
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
        run: gh release upload "$REF" out/* -R "$REPO" --clobber

  windows:
    name: Windows
    needs: release
    if: ${{ !inputs.check_only }}
    runs-on: windows-latest
    steps:
      - name: Choose the repository
        shell: bash
        env:
          SECRET_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          r=$(jq -r '.inputs.repo // ""' "$GITHUB_EVENT_PATH")
          [ -n "$r" ] || r="$SECRET_REPO"
          echo "::add-mask::$r"
          echo "::add-mask::${r#*/}"
          echo "REPO=$r" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Downloaded and compiled dependencies (public crates), keyed by the repository's
      # Cargo.lock. rust-cache removes the repository's own crates from target/ before saving,
      # so no private code or embedded assets reach this public repository's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: pwsh -File ci/release.ps1 -Ref "$env:REF"
      - name: Upload
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
        run: gh release upload "$env:REF" (Get-ChildItem out).FullName -R "$env:REPO" --clobber

  android:
    name: Android
    needs: release
    if: ${{ !inputs.check_only && inputs.android }}
    runs-on: ubuntu-latest
    steps:
      - name: Choose the repository
        shell: bash
        env:
          SECRET_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          r=$(jq -r '.inputs.repo // ""' "$GITHUB_EVENT_PATH")
          [ -n "$r" ] || r="$SECRET_REPO"
          echo "::add-mask::$r"
          echo "::add-mask::${r#*/}"
          echo "REPO=$r" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Downloaded and compiled dependencies (public crates), keyed by the repository's
      # Cargo.lock. rust-cache removes the repository's own crates from target/ before saving,
      # so no private code or embedded assets reach this public repository's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Phone app (signed with the owner's Android key)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash ci/android.sh aarch64-linux-android "$REF"
      - name: Upload
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
        run: gh release upload "$REF" out/*.apk -R "$REPO" --clobber

  android-check:
    name: Android emulator check
    needs: release
    if: ${{ !inputs.check_only && inputs.android }}
    runs-on: ubuntu-latest
    steps:
      - name: Choose the repository
        shell: bash
        env:
          SECRET_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          r=$(jq -r '.inputs.repo // ""' "$GITHUB_EVENT_PATH")
          [ -n "$r" ] || r="$SECRET_REPO"
          echo "::add-mask::$r"
          echo "::add-mask::${r#*/}"
          echo "REPO=$r" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Downloaded and compiled dependencies (public crates), keyed by the repository's
      # Cargo.lock. rust-cache removes the repository's own crates from target/ before saving,
      # so no private code or embedded assets reach this public repository's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test build (x86_64, debug key)
        run: bash ci/android.sh x86_64-linux-android "$REF"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash ci/android-check.sh
      # The screenshot can show private content: it goes to the repository's own
      # pre-release "android-check", never to this public repository.
      - name: Keep the screenshot (privately)
        if: always()
        env:
          GH_TOKEN: ${{ (github.event.inputs.repo != '' && secrets.RELEASE_TOKEN) || secrets.PRIVATE_REPO_TOKEN }}
        run: |
          ls out/android-check*.png >/dev/null 2>&1 || exit 0
          gh release view android-check -R "$REPO" >/dev/null 2>&1 \
            || gh release create android-check -R "$REPO" --prerelease --title "Android emulator check" --notes "Screenshots from the emulator check." --target "$REF" >/dev/null 2>&1 \
            || true
          gh release upload android-check out/android-check*.png out/android-check-log.txt -R "$REPO" --clobber

